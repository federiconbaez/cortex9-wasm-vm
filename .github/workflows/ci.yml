name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Release run (all 73 spec files, 60 000 mutated modules)
        run: cargo test --release -- --nocapture

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus from the spec modules
        run: cargo run --release --example dump_corpus -- fuzz/seeds
      - name: Fuzz decode → validate → run for 60 s
        run: cd fuzz && mkdir -p corpus/decode_run && cargo fuzz run decode_run corpus/decode_run seeds -- -max_total_time=60 -rss_limit_mb=2048

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - run: cargo build --locked
